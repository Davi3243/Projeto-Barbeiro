<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will Barbershop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Logo / LOGO ===== -->
  <header class="logo">
    <img src="Imagens/logo.png" alt="Will Barbershop" class="logo__img">
  </header>

  <!-- ===== VÍDEO + FOTO ===== -->
  <section class="video">
    <div class="video__frame">
      <video
        class="video__media"
        controls
        preload="metadata">
        <source src="Imagens/video.mp4" type="video/mp4">
        Seu navegador não suporta a exibição deste vídeo.
      </video>
    </div>

    <div class="video__frame">
      <img src="Imagens/cortee.png" alt="Barbeiro finalizando o corte" class="video__media video__media--img">
    </div>
  </section>

  <!-- ===== AGENDAMENTO ===== -->
  <section class="agendamento">
    <a href="Agendamento.html" target="_blank" rel="noopener" class="agendamento__wpp">
      <h2 class="titulo-do-agendamento">Agende seu horário</h2>
    </a>
  </section>

  <!-- ===== REDES SOCIAIS ===== -->
  <section class="redes-sociais">
    <a href="https://www.instagram.com/willbarber.ofc?igsi=MTE1YWxnd2x2YXRpaw%3D%3D&utm_source=qr" target="_blank" rel="noopener" class="social__link">
      <img src="Imagens/insta.png" alt="Instagram Will Barbershop" class="social-insta">
    </a>
    <a href="https://wa.link/bmg76a" target="_blank" rel="noopener" class="social__link">
      <img src="Imagens/whats.png" alt="WhatsApp Will Barbershop" class="social-wpp">
    </a>
  </section>

  <!-- ===== BOTÃO FLUTUANTE WHATSAPP ===== -->
  <a href="https://wa.link/bmg76a" target="_blank" rel="noopener" class="whats-float">
    <img src="Imagens/whats.png" alt="Falar no WhatsApp">
  </a>

</body>
</html>
